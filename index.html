<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conectado2 - Gestión de Internet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @keyframes animacionBienvenida {
      0% { opacity: 0.25; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.01); }
      100% { opacity: 0.25; transform: scale(0.98); }
    }
    .anim-bienvenida { animation: animacionBienvenida 4s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <nav class="bg-blue-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-2">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-wifi text-2xl text-yellow-300"></i>
        <span class="text-2xl font-black tracking-wide">Conectado2</span>
      </div>
      <div id="nav-bienvenida-box" class="hidden text-center flex-1 px-4">
        <span id="nav-bienvenida-texto" class="anim-bienvenida inline-block text-sm md:text-base font-extrabold text-yellow-300 drop-shadow-sm tracking-wide"></span>
      </div>
      <div id="nav-user-box" class="hidden flex items-center space-x-3">
        <span id="nav-user-badge" class="text-xs bg-blue-800 px-3 py-1.5 rounded-full font-medium shadow-inner"></span>
        <button onclick="cerrarSesion()" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded text-white font-bold transition shadow">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <!-- VISTA AUTH -->
    <section id="view-auth" class="max-w-lg mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-lg border border-slate-200">
      <div class="flex border-b border-slate-200 mb-6">
        <button type="button" id="tab-login-user-btn" onclick="cambiarPestana('login-user')" class="flex-1 pb-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 text-xs sm:text-sm">Portal Clientes</button>
        <button type="button" id="tab-register-btn" onclick="cambiarPestana('registro')" class="flex-1 pb-3 text-center font-bold text-slate-400 hover:text-slate-600 text-xs sm:text-sm">Solicitar Servicio</button>
        <button type="button" id="tab-login-admin-btn" onclick="cambiarPestana('login-admin')" class="flex-1 pb-3 text-center font-bold text-slate-400 hover:text-slate-600 text-xs sm:text-sm">Admin / Socios</button>
      </div>

      <form id="form-login-user" onsubmit="iniciarSesionCliente(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Cédula de Ciudadanía</label>
          <input type="number" id="login-user-cedula" required placeholder="Escribe tu número de cédula" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-base font-bold text-slate-800 bg-slate-50" />
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-sm">Ingresar al Portal</button>
      </form>

      <form id="form-login-admin" onsubmit="iniciarSesionAdmin(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Usuario o Correo</label>
          <input type="text" id="login-admin-identificador" required placeholder="ej: jeliasmazo@gmail.com o JANIER.MAZO" class="w-full px-3 py-2 border rounded-lg text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña (Mín. 12 chars)</label>
          <input type="password" id="login-admin-pass" required placeholder="••••••••••••" class="w-full px-3 py-2 border rounded-lg text-sm" />
        </div>
        <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-lg text-sm">Ingresar al Panel</button>
      </form>

      <form id="form-register" onsubmit="registrarSolicitudPublica(event)" class="space-y-3 hidden">
        <div class="p-3 bg-blue-50 border border-blue-200 rounded-xl text-xs space-y-1">
          <p>Plan: <b>20 MB</b> | Mensualidad: <b>$50.000 COP</b></p>
          <p>Instalación Fija: <b class="text-yellow-800 bg-yellow-300 px-1.5 rounded">$90.000 COP</b></p>
        </div>
        <input type="text" id="reg-nombre" required placeholder="Nombre Completo" class="w-full px-3 py-2 border rounded-lg text-sm" />
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="reg-cedula" oninput="validarCedulaDuplicadaEnRegistro()" required placeholder="Cédula" class="w-full px-3 py-2 border rounded-lg text-sm" />
          <input type="tel" id="reg-celular" required placeholder="Celular" class="w-full px-3 py-2 border rounded-lg text-sm" />
        </div>
        <div id="aviso-cedula-duplicada" class="hidden p-2 bg-amber-50 text-amber-800 text-xs rounded border border-amber-300">Cédula ya registrada.</div>
        <input type="text" id="reg-email" placeholder="Correo (opcional)" class="w-full px-3 py-2 border rounded-lg text-sm" />
        <div class="flex items-start gap-2 pt-1">
          <input type="checkbox" id="reg-acepto-terminos" required class="mt-1" />
          <label for="reg-acepto-terminos" class="text-xs text-slate-700">Acepto instalación de $90.000 COP y condiciones de línea de vista.</label>
        </div>
        <button type="submit" id="btn-enviar-solicitud" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg text-sm">Enviar Solicitud</button>
      </form>
    </section>

    <!-- PANEL ADMIN -->
    <section id="view-admin" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
        <div>
          <h2 class="text-2xl font-bold text-slate-800">Panel Administrador - Conectado2</h2>
          <p id="admin-subtitulo-rol" class="text-xs text-slate-500"></p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="exportarClientesExcel()" class="bg-emerald-700 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl shadow">Exportar Excel</button>
          <label class="bg-emerald-600 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl shadow cursor-pointer">
            Importar Excel
            <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" onchange="importarExcelClientes(event)" class="hidden" />
          </label>
          <button onclick="toggleModalCrearUsuario(true)" class="bg-blue-600 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl shadow">Nuevo Cliente</button>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
          <h3 class="font-bold text-sm text-slate-700">Clientes Registrados</h3>
          <span id="admin-contador" class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded-full"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-100 text-slate-600 uppercase font-bold border-b">
              <tr>
                <th class="p-3">Cliente</th>
                <th class="p-3">Cédula</th>
                <th class="p-3">Contacto</th>
                <th class="p-3">Tarifa</th>
                <th class="p-3">Estado</th>
                <th class="p-3 text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-usuarios" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- MODAL NUEVO CLIENTE -->
    <div id="modal-crear-usuario" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-200">
        <h3 class="text-base font-bold text-slate-800 mb-3 border-b pb-2">Nuevo Cliente</h3>
        <form onsubmit="crearUsuarioAdmin(event)" class="space-y-3">
          <input type="text" id="admin-new-nombre" required placeholder="Nombre Completo" class="w-full px-3 py-2 border rounded-lg text-sm" />
          <div class="grid grid-cols-2 gap-2">
            <input type="number" id="admin-new-cedula" required placeholder="Cédula" class="w-full px-3 py-2 border rounded-lg text-sm" />
            <input type="tel" id="admin-new-celular" required placeholder="Celular" class="w-full px-3 py-2 border rounded-lg text-sm" />
          </div>
          <input type="text" id="admin-new-email" placeholder="Correo (opcional)" class="w-full px-3 py-2 border rounded-lg text-sm" />
          <input type="number" id="admin-new-tarifa" required value="50000" class="w-full px-3 py-2 border rounded-lg text-sm" />
          <input type="date" id="admin-new-fecha-instalacion" required class="w-full px-3 py-2 border rounded-lg text-sm" />
          <div class="flex justify-end gap-2 pt-3 border-t">
            <button type="button" onclick="toggleModalCrearUsuario(false)" class="px-4 py-2 bg-slate-100 text-xs rounded-lg">Cancelar</button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg">Registrar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    // Supabase Storage sync client setup
    const SUPABASE_URL = "https://vebsnjvihcxigmkvcsem.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_hTGwIFWA4k9Hp17yq4S9Ig_pey76aob";
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const ADMIN_CORREO_PRINCIPAL = "jeliasmazo@gmail.com";
    const ADMIN_CLAVE_PRINCIPAL = "98013262140Ja**";

    let clientes = JSON.parse(localStorage.getItem('conectado2_usuarios')) || [];
    let administradoresSocios = JSON.parse(localStorage.getItem('conectado2_socios')) || [];
    let esSocioSoloLectura = false;

    function parseMonto(v) { return parseInt(String(v || 50000).replace(/[^0-9]/g, ""), 10) || 50000; }
    function formatearDinero(n) { return "$" + Number(n).toLocaleString('es-CO'); }

    function cambiarPestana(p) {
      document.getElementById('form-login-user').classList.toggle('hidden', p !== 'login-user');
      document.getElementById('form-login-admin').classList.toggle('hidden', p !== 'login-admin');
      document.getElementById('form-register').classList.toggle('hidden', p !== 'registro');
    }

    function validarCedulaDuplicadaEnRegistro() {
      const cedula = document.getElementById('reg-cedula').value.trim();
      const aviso = document.getElementById('aviso-cedula-duplicada');
      const existe = clientes.some(c => String(c.cedula).trim() === cedula);
      aviso.classList.toggle('hidden', !existe);
      document.getElementById('btn-enviar-solicitud').disabled = existe;
    }

    function registrarSolicitudPublica(e) {
      e.preventDefault();
      const cedulaVal = document.getElementById('reg-cedula').value.trim();
      if (clientes.some(c => String(c.cedula).trim() === cedulaVal)) {
        alert("Cédula ya registrada.");
        return;
      }
      clientes.push({
        nombre: document.getElementById('reg-nombre').value.trim(),
        cedula: cedulaVal,
        celular: document.getElementById('reg-celular').value.trim(),
        email: document.getElementById('reg-email').value.trim() || "Sin correo",
        plan: "20 MB",
        tarifa: 50000,
        estado: "Activo",
        pagoAprobadoAdmin: true
      });
      localStorage.setItem('conectado2_usuarios', JSON.stringify(clientes));
      alert("¡Solicitud registrada con éxito!");
      cambiarPestana('login-user');
    }

    function iniciarSesionAdmin(e) {
      e.preventDefault();
      const iden = document.getElementById('login-admin-identificador').value.trim();
      const pass = document.getElementById('login-admin-pass').value.trim();
      if (iden.toLowerCase() === ADMIN_CORREO_PRINCIPAL.toLowerCase() && pass === ADMIN_CLAVE_PRINCIPAL) {
        esSocioSoloLectura = false;
        abrirPanelAdmin("Janier Mazo", "Administrador Principal");
        return;
      }
      alert("Credenciales inválidas.");
    }

    function abrirPanelAdmin(nombre, rol) {
      document.getElementById('view-auth').classList.add('hidden');
      document.getElementById('view-admin').classList.remove('hidden');
      document.getElementById('nav-user-box').classList.remove('hidden');
      document.getElementById('nav-user-badge').innerText = rol;
      document.getElementById('admin-subtitulo-rol').innerText = "Sesión: " + nombre;
      cargarTablaAdmin();
    }

    function cargarTablaAdmin() {
      const tbody = document.getElementById('tabla-usuarios');
      tbody.innerHTML = "";
      document.getElementById('admin-contador').innerText = clientes.length + " clientes";
      clientes.forEach((u, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-3 font-bold">${u.nombre}</td>
          <td class="p-3">${u.cedula}</td>
          <td class="p-3">${u.celular}</td>
          <td class="p-3">${formatearDinero(u.tarifa)}</td>
          <td class="p-3">${u.estado}</td>
          <td class="p-3 text-center">
            <button onclick="eliminarCliente(${idx})" class="bg-red-50 text-red-700 px-2 py-1 rounded text-xs font-bold">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleModalCrearUsuario(abrir) {
      document.getElementById('modal-crear-usuario').classList.toggle('hidden', !abrir);
    }

    function crearUsuarioAdmin(e) {
      e.preventDefault();
      clientes.push({
        nombre: document.getElementById('admin-new-nombre').value.trim(),
        cedula: document.getElementById('admin-new-cedula').value.trim(),
        celular: document.getElementById('admin-new-celular').value.trim(),
        email: document.getElementById('admin-new-email').value.trim() || "Sin correo",
        plan: "20 MB",
        tarifa: parseMonto(document.getElementById('admin-new-tarifa').value),
        estado: "Activo"
      });
      localStorage.setItem('conectado2_usuarios', JSON.stringify(clientes));
      toggleModalCrearUsuario(false);
      cargarTablaAdmin();
      alert("Cliente creado.");
    }

    function eliminarCliente(idx) {
      if (confirm("¿Eliminar cliente?")) {
        clientes.splice(idx, 1);
        localStorage.setItem('conectado2_usuarios', JSON.stringify(clientes));
        cargarTablaAdmin();
      }
    }

    function exportarClientesExcel() {
      if (!clientes.length) return alert("No hay clientes.");
      const hoja = XLSX.utils.json_to_sheet(clientes);
      const libro = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(libro, hoja, "Clientes");
      XLSX.writeFile(libro, "clientes_conectado2.xlsx");
    }

    function importarExcelClientes(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);
        if (json.length) {
          json.forEach(row => {
            clientes.push({
              nombre: row.NOMBRE || row.nombre || "Cliente Excel",
              cedula: String(row.CEDULA || row.cedula || Date.now()).replace(/[^0-9]/g, ""),
              celular: String(row.CELULAR || "3000000000"),
              plan: "20 MB",
              tarifa: 50000,
              estado: "Activo"
            });
          });
          localStorage.setItem('conectado2_usuarios', JSON.stringify(clientes));
          cargarTablaAdmin();
          alert(`Importados ${json.length} registros.`);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function cerrarSesion() { window.location.reload(); }
  </script>
</body>
</html>
